# Hot-reload frontend for development:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
